<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var l = location;
        var route = l.pathname + l.search + l.hash;

        // Never redirect to the same kind of page again - that would loop.
        if (/\/index\.html$/.test(l.pathname)) {
          l.replace(l.origin + '/index.html?route=' + encodeURIComponent(route));
          return;
        }

        var parts = l.pathname.split('/').filter(Boolean);
        var isGh = l.hostname.endsWith('.github.io');
        var appPaths = ['about', 'contact', 'experience', 'assets', 'index.html'];

        // username.github.io/<repo> -> the repo is the base.
        // username.github.io or a custom domain -> there is no base.
        var isProjectPage = isGh && parts.length > 1 && appPaths.indexOf(parts[1]) === -1;
        var base = isProjectPage ? '/' + parts[0] : '';

        l.replace(l.origin + base + '/index.html?route=' + encodeURIComponent(route));
      })();
    </script>
  </head>
  <body></body>
</html>
