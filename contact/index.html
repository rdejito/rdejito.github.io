<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function () {
        // This file is served at /contact/ (or /<repo>/contact/ on project pages).
        // Strip the trailing slash and keep only the last segment as the route.
        var path = location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
        var route = path.slice(path.lastIndexOf('/')) + location.search + location.hash;
        location.replace('../index.html?route=' + encodeURIComponent(route));
      })();
    </script>
  </head>
  <body></body>
</html>
